name: Daily Training Pipeline

on:
  schedule:
    - cron: "0 2 * * *"   # once a day at 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: python src/train_pipeline.py

      - name: Commit updated model + metrics
        run: |
          git config --global user.name "aqi-bot"
          git config --global user.email "aqi-bot@users.noreply.github.com"
          git add models/ reports/
          git diff --cached --quiet || git commit -m "chore: daily model retrain [skip ci]"
          git push
